services:
  minio:
    build:
      context: .
      dockerfile: ./minio/minio.Dockerfile
    container_name: minio-forge-commerce
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      MINIO_REGION: ${MINIO_REGION}
    volumes:
      - minio_data:/data/minio
    networks:
      - default-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      MINIO_REGION: ${MINIO_REGION}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MINIO_ALIAS: ${MINIO_ALIAS}
    volumes:
      # - .:/workspace
      - ./tools/minio-setup.sh:/workspace/tools/minio-setup.sh
    entrypoint: >
      /bin/sh -c "chmod +x /workspace/tools/minio-setup.sh && /workspace/tools/minio-setup.sh"
    networks:
      - default-network

  spark-master:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-master
    hostname: spark-master
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "7077:7077" # Worker's communication port
      - "8080:8080" # Master UI
    environment:
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - default-network

  spark-worker-1:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Worker 1 UI port
    environment:
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - default-network

  spark-worker-2:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    depends_on:
      - spark-master
    ports:
      - "8082:8081" # Worker 2 UI port
    environment:
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - default-network
    # For batch job submissions
  spark-submit:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-submit
    command: sleep infinity
    volumes:
      - ./spark:/app # Mount your Python scripts directory
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER=spark://spark-master:7077
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - default-network
    depends_on:
      - spark-master
