version: '3.8'

services:
  minio:
    build: ./minio
    container_name: minio-forge-commerce
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: localhost
      MINIO_REGION: us-east-1
    volumes:
      - minio_data:/data/minio
    networks:
      - minio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - .:/workspace
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 admin password; do
        echo 'Waiting for MinIO to be ready...'
        sleep 5
      done;
      /usr/bin/mc mb myminio/raw;
      /usr/bin/mc mb myminio/cleaned;
      /usr/bin/mc mb myminio/curated;
      /usr/bin/mc admin user add myminio/ forge-commerce-user forge-commerce-pass;
      /usr/bin/mc admin policy set myminio/ readwrite user=forge-commerce-user;
      exit 0;
      "
    networks:
      - minio-network

volumes:
  minio_data:

networks:
  minio-network:
    driver: bridge