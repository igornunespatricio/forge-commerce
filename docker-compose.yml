services:
  minio:
    build: ./minio
    container_name: minio-forge-commerce
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: localhost
      MINIO_REGION: us-east-1
    volumes:
      - minio_data:/data/minio
    networks:
      - minio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - .:/workspace
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 admin password; do
        echo 'Waiting for MinIO to be ready...'
        sleep 5
      done;
      /usr/bin/mc mb myminio/raw;
      /usr/bin/mc mb myminio/cleaned;
      /usr/bin/mc mb myminio/curated;
      /usr/bin/mc admin user add myminio/ forge-commerce-user forge-commerce-pass;
      /usr/bin/mc admin policy set myminio/ readwrite user=forge-commerce-user;
      exit 0;
      "
    networks:
      - minio-network
  
  spark-master:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-master
    hostname: spark-master
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "7077:7077"   # Worker's communication port
      - "8080:8080"   # Master UI
    environment:
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - spark-network

  spark-worker-1:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    depends_on:
      - spark-master
    ports:
      - "8081:8081"   # Worker 1 UI port
    environment:
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - spark-network

  spark-worker-2:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: bash -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    depends_on:
      - spark-master
    ports:
      - "8082:8081"  # Worker 2 UI port
    environment:
      - SPARK_HOME=/opt/spark
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - spark-network
  
    # For batch job submissions
  spark-submit:
    build:
      context: .
      dockerfile: ./spark/spark.Dockerfile
    container_name: spark-submit
    command: sleep infinity
    volumes:
      - ./spark:/app  # Mount your Python scripts directory
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER=spark://spark-master:7077
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - spark-network
    depends_on:
      - spark-master

  # For interactive Jupyter notebooks
  jupyter:
    build:
      context: .
      dockerfile: ./spark/jupyter.Dockerfile
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./spark/jupyter_notebook_config.py:/home/jovyan/.jupyter/jupyter_notebook_config.py
      - ./spark/notebooks:/home/jovyan/notebooks
      - ./.env:/home/jovyan/.env
    environment:
      - SPARK_OPTS=--master spark://spark-master:7077
      - SPARK_HOME=/opt/spark
      - JUPYTER_ENABLE_LAB=yes
      - AWS_ACCESS_KEY_ID=forge-commerce-user
      - AWS_SECRET_ACCESS_KEY=forge-commerce-pass
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_REGION=us-east-1
      - AWS_S3_PATH_STYLE_ACCESS=true
    networks:
      - spark-network
    depends_on:
      - spark-master


volumes:
  minio_data:

networks:
  minio-network:
    driver: bridge
  spark-network:
    driver: bridge