[tool.poetry]
name = "forge-commerce-faker"
version = "0.1.0"
description = "Synthetic data generation for e-commerce data warehouse"
authors = ["Data Engineering Team"]

[tool.poetry.dependencies]
python = "^3.8.1"
pandas = "^2.0.0"
faker = "^20.0.0"
numpy = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
