[tool.poetry]
name = "forge-commerce-faker"
version = "0.1.0"
description = "Synthetic data generation for e-commerce data warehouse"
authors = ["Data Engineering Team"]

package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
faker = "^20.0.0"
numpy = "^1.24.0"
requests = "^2.32.0"
boto3 = "^1.33.0"

# API dependencies
fastapi = "^0.104.0"
uvicorn = { extras = ["standard"], version = "^0.24.0" }
pydantic = "^2.5.0"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
