log4j.rootLogger=ERROR, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p %c: %m%n

# ========================================
# Suppress SLF4J Warnings
# ========================================
# Suppress the "multiple bindings" warning by setting explicit levels
log4j.logger.org.slf4j.impl.StaticLoggerBinder=OFF
log4j.logger.org.apache.commons.logging.impl.LogFactoryImpl=OFF
log4j.logger.org.apache.log4j.LogManager=OFF
