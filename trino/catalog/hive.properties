# Hive Metastore Catalog Configuration for Trino (FINAL WORKING VERSION)
connector.name=hive

# Enable Trino Native S3 Filesystem (REQUIRED)
fs.native-s3.enabled=true


# Native S3 Configuration for MinIO (NO hive. PREFIX - direct catalog properties)
s3.endpoint=http://minio:9000
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
s3.path-style-access=true
s3.region=us-east-1

# Hive Metastore Connection
hive.metastore.uri=thrift://metastore:9083
hive.metastore.thrift.client.connect-timeout=60s
hive.metastore.thrift.client.read-timeout=60s

# Performance Tuning
hive.parquet.use-column-names=true
hive.orc.use-column-names=true
hive.max-outstanding-splits=1000
hive.max-partitions-for-eager-load=100000

# Storage Formats
hive.storage-format=PARQUET
hive.compression-codec=SNAPPY

# Allow writes to external (non-managed) Hive tables
hive.non-managed-table-writes-enabled=true

# Automatic partition discovery
hive.recursive-directories=true
hive.partition-projection-enabled=true
